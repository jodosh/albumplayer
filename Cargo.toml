[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/engine",
    "crates/enrich",
    "crates/server",
    "crates/cli",
    "crates/desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
albumplayer-core = { path = "crates/core" }
albumplayer-engine = { path = "crates/engine" }
albumplayer-enrich = { path = "crates/enrich" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
