[package]
name = "albumplayer-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "albumplayer-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
albumplayer-engine.workspace = true
serde.workspace = true
serde_json = "1"
tauri = { version = "2", features = [] }
# Lock screen and media keys. zbus rather than libdbus on Linux, so the package
# needs no extra system library.
souvlaki = { version = "0.9.3", default-features = false, features = ["use_zbus"] }
